services:
  modbridge:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: modbridge
    hostname: modbridge

    ports:
      - "8080:8080"            # Web UI & API
      - "5020-5030:5020-5030"  # Modbus proxy ports

    volumes:
      # The config directory is mounted, not config.json itself: saving from
      # the UI replaces the file, and a bind-mounted single file cannot be
      # replaced.
      - modbridge-config:/app/config
      - modbridge-data:/app/data
      - modbridge-logs:/app/logs

    environment:
      - WEB_PORT=0.0.0.0:8080
      - LOG_LEVEL=INFO
      - TZ=UTC
      # Where the database, the logs and config.json live. These have to match
      # the volumes above, otherwise the state is written into the container
      # layer and lost on recreate.
      - MODBRIDGE_DATA_DIR=/app/data
      - MODBRIDGE_LOG_DIR=/app/logs
      - MODBRIDGE_CONFIG=/app/config/config.json
      # Set this when ModBridge runs behind a reverse proxy, so that
      # X-Forwarded-For is only trusted from those addresses.
      # - MODBRIDGE_TRUSTED_PROXIES=172.16.0.0/12
      # Required when MODBRIDGE_ENV=production, otherwise the server refuses
      # to start. Without it a random secret is generated at each start.
      # - MODBRIDGE_CSRF_SECRET=change-me

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          memory: 256M

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  modbridge-config:
  modbridge-data:
  modbridge-logs:
