name: Sync Wiki Documentation

on:
  push:
    branches: [main]
    paths: ['docs/**']
  workflow_dispatch:

jobs:
  sync-wiki:
    name: Sync docs to GitHub Wiki
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The token is passed as an http.extraheader rather than embedded in the
      # clone URL, so it does not end up written to /tmp/wiki/.git/config.
      - name: Clone wiki repository
        env:
          GIT_TERMINAL_PROMPT: 0
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=$AUTH_HEADER" \
            clone "https://github.com/${{ github.repository }}.wiki.git" /tmp/wiki

      - name: Copy wiki files and assets
        run: |
          # Remove stale markdown pages first so renamed/deleted docs disappear from the wiki
          find /tmp/wiki -maxdepth 1 -name '*.md' -delete
          cp docs/*.md /tmp/wiki/
          if [ -d docs/assets ]; then
            cp -r docs/assets /tmp/wiki/assets
          fi

      - name: Commit and push to wiki
        working-directory: /tmp/wiki
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to wiki pages."
          else
            git commit -m "docs: sync wiki from docs/ [skip ci]"
            AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
            git -c "http.https://github.com/.extraheader=$AUTH_HEADER" push
          fi
