name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs of the same branch/PR to save CI minutes. The
# auto-release job is NOT cancelled this way: it gets its own queueing
# concurrency group further down so rapid main pushes can never race the
# version bump (two concurrent auto-releases would otherwise fight over
# version.txt and the next tag).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: '1.26.5'
  NODE_VERSION: '24'

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      next: ${{ steps.compute.outputs.next }}
      stamp: ${{ steps.compute.outputs.stamp }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The release binaries used to be stamped with github.ref_name, and the
      # auto-release runs on a push to main — so every published binary called
      # itself "main" and nobody could tell which version they were running.
      # The number is decided here, once, and both the builds and the release
      # use it.
      - name: Decide the version this run carries
        id: compute
        run: |
          git fetch --tags --force
          CURRENT=$(tr -d '[:space:]' < version.txt)
          if [[ ! "$CURRENT" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Invalid version in version.txt: ${CURRENT}"
            exit 1
          fi
          IFS='.' read -r MAJOR MINOR PATCH BUILD <<< "$CURRENT"
          BUILD=${BUILD:-0}
          BUILD=$((BUILD + 1))
          NEXT="${MAJOR}.${MINOR}.${PATCH}.${BUILD}"
          while git rev-parse -q --verify "refs/tags/v${NEXT}" >/dev/null; do
            BUILD=$((BUILD + 1))
            NEXT="${MAJOR}.${MINOR}.${PATCH}.${BUILD}"
          done

          # What the binary calls itself: the version about to be released on a
          # push to main, the tag when built from one, and otherwise a name that
          # says plainly this is not a release.
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            STAMP="$NEXT"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            STAMP="${{ github.ref_name }}"
          else
            STAMP="dev-${{ github.ref_name }}"
          fi

          echo "next=${NEXT}"   >> $GITHUB_OUTPUT
          echo "stamp=${STAMP}" >> $GITHUB_OUTPUT
          echo "This run builds ${STAMP}; a release from it would be v${NEXT}"

  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run go fmt
        run: |
          fmt_output=$(gofmt -l .)
          if [ -n "$fmt_output" ]; then
            echo "The following files need formatting:"
            echo "$fmt_output"
            exit 1
          fi

      - name: Run go vet
        env:
          CGO_ENABLED: 1
        run: go vet ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run tests
        env:
          CGO_ENABLED: 1
        run: |
          PACKAGES=$(go list -f '{{if or (len .TestGoFiles) (len .XTestGoFiles)}}{{.ImportPath}}{{end}}' ./...)
          go test -v -race -coverprofile=coverage.txt -covermode=atomic $PACKAGES

      - uses: codecov/codecov-action@v7
        with:
          file: ./coverage.txt
          continue-on-error: true

  benchmarks:
    name: Benchmark Guardrails
    runs-on: ubuntu-latest
    needs: [quality, test]
    timeout-minutes: 20
    # Run on PRs + pushes to main. Continue-on-error would hide regressions,
    # so the job fails the build when a threshold is exceeded. Thresholds are
    # intentionally generous (see scripts/ci/check_bench.sh) to reduce CI flak.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run benchmark guardrails
        env:
          CGO_ENABLED: 1
        run: bash scripts/ci/check_bench.sh

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install & build
        working-directory: ./frontend
        env:
          VITE_PRIMEVUE_LICENSE: ${{ secrets.VITE_PRIMEVUE_LICENSE }}
        run: npm ci && npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  e2e:
    name: E2E (WebUI)
    runs-on: ubuntu-latest
    needs: [build-frontend]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      # Reuse the WebUI built by build-frontend instead of building it twice.
      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Embed WebUI and build the binary under test
        run: |
          rm -rf pkg/web/dist
          cp -r frontend/dist pkg/web/dist
          CGO_ENABLED=1 go build -o modbridge .

      - name: Install Playwright browser
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      # The suite starts the binary itself, walks the first-run password
      # change and drives the UI, so it covers what a build and unit tests
      # cannot: whether the page actually works when clicked.
      - name: Run end-to-end tests
        working-directory: ./frontend
        run: npm run test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
            frontend/e2e-setup-failure.png
          retention-days: 7
          if-no-files-found: ignore

  build-binaries:
    name: Build (${{ matrix.suffix }})
    runs-on: ubuntu-latest
    needs: [version, quality, test, build-frontend]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
            packages: ''
            cc: ''
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
            packages: gcc-aarch64-linux-gnu
            cc: aarch64-linux-gnu-gcc
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install cross-compiler
        if: matrix.packages != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }}

      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Copy frontend to embed path
        run: |
          mkdir -p pkg/web/dist
          rm -rf pkg/web/dist/*
          cp -r frontend/dist/* pkg/web/dist/

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
          CC: ${{ matrix.cc }}
        run: |
          go build \
            -ldflags="-s -w -X main.Version=${{ needs.version.outputs.stamp }}" \
            -trimpath \
            -o "modbridge-${{ matrix.suffix }}" \
            .

      - uses: actions/upload-artifact@v7
        with:
          name: modbridge-${{ matrix.suffix }}
          path: modbridge-${{ matrix.suffix }}
          retention-days: 7

  build-headless:
    name: Headless (${{ matrix.suffix }})
    runs-on: ubuntu-latest
    needs: [version, quality, test]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64-headless
            packages: ''
            cc: ''
          - goos: linux
            goarch: arm64
            suffix: linux-arm64-headless
            packages: gcc-aarch64-linux-gnu
            cc: aarch64-linux-gnu-gcc
          - goos: linux
            goarch: arm
            goarm: '6'
            suffix: linux-arm-headless
            packages: gcc-arm-linux-gnueabihf
            cc: arm-linux-gnueabihf-gcc
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install cross-compiler
        if: matrix.packages != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }}

      # Headless needs NO frontend-dist — it has no embedded Web UI and shares
      # only pkg/config, pkg/logger, pkg/manager with the Web binary.
      - name: Build headless binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: 1
          CC: ${{ matrix.cc }}
        run: |
          go build \
            -ldflags="-s -w -X main.Version=${{ needs.version.outputs.stamp }}" \
            -trimpath \
            -o "modbridge-${{ matrix.suffix }}" \
            ./cmd/modbridge-headless

      - uses: actions/upload-artifact@v7
        with:
          name: modbridge-${{ matrix.suffix }}
          path: modbridge-${{ matrix.suffix }}
          retention-days: 7

  auto-release:
    name: Auto Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The browser suite is deliberately NOT a gate here. It drives a real
    # binary through a real browser, which makes it the most valuable check
    # and the least reliable one — a slow runner is enough to fail it. It
    # already blocked one release for a reason that had nothing to do with the
    # release. Its result stays visible as a red check on main; it just no
    # longer holds the tag hostage. Everything that can be trusted to be
    # deterministic still gates: compile, vet, unit tests, all binaries.
    needs: [version, quality, test, build-frontend, build-binaries, build-headless]
    timeout-minutes: 15
    permissions:
      contents: write
    # Serialize auto-releases: a second push while one is running must wait
    # (not cancel) so the version bump + tag push never race.
    concurrency:
      group: auto-release-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # The number was decided by the version job, and the binaries waiting to
      # be published carry it. Recomputing it here would risk publishing a tag
      # the binaries do not agree with, so this only records what was decided.
      - name: Record the version
        id: bump
        run: |
          NEW_VERSION="${{ needs.version.outputs.next }}"
          TAG="v${NEW_VERSION}"
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::${TAG} already exists — the binaries of this run are stamped ${NEW_VERSION}, so publishing under another tag would mislabel them. Push to main again to build a fresh version."
            exit 1
          fi
          echo "$NEW_VERSION" > version.txt
          echo "version=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Releasing ${NEW_VERSION} (${TAG})"

      - name: Commit version bump & tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.txt
          git commit -m "chore: bump version to ${{ steps.bump.outputs.version }} [skip ci]"
          git tag -a "${{ steps.bump.outputs.tag }}" -m "Release ${{ steps.bump.outputs.tag }}"
          git push origin main --follow-tags

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/
          pattern: modbridge-*
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend-dist/

      - name: Prepare release files & checksums
        run: |
          mkdir -p release
          find artifacts -type f -name 'modbridge*' -exec cp {} release/ \;
          cd release && sha256sum modbridge-* > checksums.txt && ls -lh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.bump.outputs.tag }}
          name: "ModBridge ${{ steps.bump.outputs.tag }}"
          files: release/*
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          body: |
            ## ModBridge ${{ steps.bump.outputs.tag }}

            ### Binaries (with WebUI)
            | Platform | File |
            |----------|------|
            | Linux x64 | `modbridge-linux-amd64` |
            | Linux ARM64 | `modbridge-linux-arm64` |

            ### Headless Binaries (without WebUI)
            | Platform | File |
            |----------|------|
            | Linux x64 | `modbridge-linux-amd64-headless` |
            | Linux ARM64 | `modbridge-linux-arm64-headless` |
            | Linux ARMv6 (32-bit) | `modbridge-linux-arm-headless` |

            SHA256 checksums: see `checksums.txt`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
