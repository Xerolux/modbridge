<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t d">
  <title id="t">Cache und Hintergrund-Abfrage</title>
  <desc id="d">Ohne Cache wartet jeder Client auf das träge Gerät. Mit Cache und Hintergrund-Abfrage hält ModBridge die Register warm und antwortet sofort, während das Gerät nur im eigenen Takt gefragt wird.</desc>

  <style>
    .bg     { fill: #ffffff; }
    .panel  { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
    .panelg { fill: #ecfdf5; stroke: #10b981; stroke-width: 1.8; }
    .h      { font: 700 15px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0f172a; }
    .t      { font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #334155; }
    .s      { font: 400 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #64748b; }
    .slow   { font: 700 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #dc2626; }
    .fast   { font: 700 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #059669; }
    .ar     { stroke: #94a3b8; stroke-width: 2; fill: none; }
    .arr    { stroke: #dc2626; stroke-width: 2; fill: none; }
    .arg    { stroke: #10b981; stroke-width: 2; fill: none; }
    .dash   { stroke: #10b981; stroke-width: 2; fill: none; stroke-dasharray: 5 4; }
  </style>

  <rect class="bg" width="960" height="420" rx="14"/>

  <!-- Without -->
  <text class="h" x="34" y="36">Ohne Cache</text>
  <rect class="panel" x="30" y="52" width="420" height="140" rx="12"/>

  <rect class="panel" x="52" y="82" width="112" height="46" rx="8"/>
  <text class="t" x="68" y="110">Client</text>

  <path class="arr" d="M164 105 H262" marker-end="url(#r)"/>
  <text class="s" x="176" y="96">fragt an</text>

  <rect class="panel" x="262" y="82" width="112" height="46" rx="8"/>
  <text class="t" x="278" y="110">Gerät</text>

  <path class="arr" d="M262 146 H164" marker-end="url(#r)"/>
  <text class="slow" x="178" y="164">antwortet nach 3 s</text>

  <text class="s" x="52" y="182">Jede einzelne Abfrage kostet die volle Wartezeit.</text>

  <!-- With -->
  <text class="h" x="34" y="238">Mit Cache und Hintergrund-Abfrage</text>
  <rect class="panelg" x="30" y="254" width="900" height="118" rx="12"/>

  <rect class="panel" x="52" y="282" width="112" height="46" rx="8"/>
  <text class="t" x="68" y="310">Client</text>

  <path class="arg" d="M164 305 H286" marker-end="url(#g)"/>
  <path class="arg" d="M286 336 H164" marker-end="url(#g)"/>
  <text class="fast" x="178" y="354">sofort aus dem Cache</text>

  <rect class="panelg" x="286" y="272" width="188" height="66" rx="8"/>
  <text class="t" x="302" y="298">Cache</text>
  <text class="s" x="302" y="318">Lebensdauer 20 s</text>

  <path class="dash" d="M474 305 H592" marker-end="url(#g)"/>
  <text class="s" x="486" y="296">hält warm</text>

  <rect class="panelg" x="596" y="272" width="186" height="66" rx="8"/>
  <text class="t" x="612" y="298">Hintergrund-Abfrage</text>
  <text class="s" x="612" y="318">alle 5 s, im eigenen Takt</text>

  <path class="ar" d="M782 305 H844" marker-end="url(#a)"/>

  <rect class="panel" x="844" y="282" width="76" height="46" rx="8"/>
  <text class="t" x="862" y="310">Gerät</text>

  <text class="s" x="52" y="392">Der Client bekommt einen wenige Sekunden alten Wert statt einer langen Wartezeit. Ein Kompromiss, den man kennen muss:</text>
  <text class="s" x="52" y="410">ein Wert aus dem Cache ist nicht der Live-Wert. Schreibzugriffe laufen nie über den Cache und verwerfen den Eintrag.</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#94a3b8"/></marker>
    <marker id="r" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#dc2626"/></marker>
    <marker id="g" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#10b981"/></marker>
  </defs>
</svg>
