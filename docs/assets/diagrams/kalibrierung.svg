<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-labelledby="t d">
  <title id="t">Wie die Kalibrierung misst</title>
  <desc id="d">Die Kalibrierung verkürzt den Abstand zwischen Anfragen schrittweise, bis das Gerät Anfragen verwirft, und empfiehlt dann den letzten sauberen Schritt mit Sicherheitsabstand.</desc>

  <style>
    .bg    { fill: #ffffff; }
    .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
    .ok    { fill: #ecfdf5; stroke: #10b981; stroke-width: 1.8; }
    .bad   { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.8; }
    .pick  { fill: #eff6ff; stroke: #2563eb; stroke-width: 2.2; }
    .h     { font: 700 17px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0f172a; }
    .t     { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0f172a; }
    .m     { font: 500 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #334155; }
    .s     { font: 400 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #64748b; }
    .okT   { font: 600 12.5px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #059669; }
    .badT  { font: 600 12.5px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #dc2626; }
    .pickT { font: 700 12.5px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #2563eb; }
    .ar    { stroke: #94a3b8; stroke-width: 2; fill: none; }
  </style>

  <rect class="bg" width="960" height="430" rx="14"/>

  <text class="h" x="34" y="40">Gerät vermessen statt Werte raten</text>
  <text class="s" x="34" y="62">Der Proxy schickt dieselbe Leseanfrage in immer kürzeren Abständen, bis das Gerät aussteigt. Nur Lesezugriffe, höchstens 90 Sekunden.</text>

  <!-- Steps -->
  <g>
    <rect class="ok" x="30" y="86" width="168" height="76" rx="10"/>
    <text class="m"   x="48" y="114">200 ms Abstand</text>
    <text class="okT" x="48" y="136">0 von 20 Fehlern</text>
    <text class="s"   x="48" y="154">p50 41 ms</text>
  </g>
  <path class="ar" d="M198 124 H228" marker-end="url(#a)"/>

  <g>
    <rect class="ok" x="228" y="86" width="168" height="76" rx="10"/>
    <text class="m"   x="246" y="114">150 ms Abstand</text>
    <text class="okT" x="246" y="136">0 von 20 Fehlern</text>
    <text class="s"   x="246" y="154">p50 41 ms</text>
  </g>
  <path class="ar" d="M396 124 H426" marker-end="url(#a)"/>

  <g>
    <rect class="ok" x="426" y="86" width="168" height="76" rx="10"/>
    <text class="m"   x="444" y="114">100 ms Abstand</text>
    <text class="okT" x="444" y="136">0 von 20 Fehlern</text>
    <text class="s"   x="444" y="154">letzter sauberer</text>
  </g>
  <path class="ar" d="M594 124 H624" marker-end="url(#a)"/>

  <g>
    <rect class="bad" x="624" y="86" width="168" height="76" rx="10"/>
    <text class="m"    x="642" y="114">50 ms Abstand</text>
    <text class="badT" x="642" y="136">3 von 6 Fehlern</text>
    <text class="s"    x="642" y="154">hier bricht es ab</text>
  </g>

  <text class="s" x="820" y="120">Ein einzelner</text>
  <text class="s" x="820" y="138">Fehler zählt nicht —</text>
  <text class="s" x="820" y="156">gewertet wird die</text>
  <text class="s" x="820" y="174">Fehlerquote.</text>

  <!-- Result -->
  <rect class="pick" x="30" y="196" width="762" height="86" rx="12"/>
  <text class="t"     x="52" y="226">Empfehlung: 100 ms  ·  1 Verbindung  ·  2 s Antwortzeit</text>
  <text class="s"     x="52" y="250">Der letzte saubere Schritt bekommt das 1,5-fache als Reserve: warm oder ausgelastet reagiert ein Gerät anders.</text>
  <text class="pickT" x="52" y="270">Übernehmen bleibt ein eigener Klick — gemessen wird, entschieden wirst du.</text>

  <!-- Guards -->
  <text class="t" x="34" y="320">Während der Messung</text>
  <g>
    <rect class="panel" x="30" y="332" width="222" height="64" rx="10"/>
    <text class="s" x="48" y="356">Keine Clients zugelassen</text>
    <text class="s" x="48" y="376">verfälscht sonst die Messung</text>
  </g>
  <g>
    <rect class="panel" x="264" y="332" width="222" height="64" rx="10"/>
    <text class="s" x="282" y="356">Health-Check und Poller ruhen</text>
    <text class="s" x="282" y="376">sonst misst der Proxy sich selbst</text>
  </g>
  <g>
    <rect class="panel" x="498" y="332" width="222" height="64" rx="10"/>
    <text class="s" x="516" y="356">Verbindung wird freigegeben</text>
    <text class="s" x="516" y="376">Geräte mit nur einer Sitzung</text>
  </g>
  <g>
    <rect class="panel" x="732" y="332" width="198" height="64" rx="10"/>
    <text class="s" x="750" y="356">Nur Lesezugriffe</text>
    <text class="s" x="750" y="376">auf bekanntem Register</text>
  </g>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#94a3b8"/></marker>
  </defs>
</svg>
